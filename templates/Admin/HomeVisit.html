{% extends 'Admin/base.html' %}
{% block content %}

<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header align-items-center d-flex">
                <h4 class="card-title mb-0 flex-grow-1">Home Visit</h4>
                <div class="flex-shrink-0">
                    <div class="form-check form-switch form-switch-right form-switch-md">
                        <label for="form-grid-showcode" class="form-label text-muted">Show
                            Code
                        </label>                       
                    </div>
                </div>
            </div><!-- end card header -->
            <div class="card-body">           
                <form method="POST" action="{% url 'HomeVisit_By_DGM' %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row gy-4">
                        <div class="col-xxl-3 col-md-6">
                            <label class="form-label">Visitor Name</label>
                            <select class="form-select  mb-3" name='name' required>
                                <option value=''>Select Visitor</option>
                                {% for item in member %}
                                    <option value="{{ item.member_name }}">{{ item.member_name }}</option>
                                {% endfor %}
                            </select>
                        </div>                        
                        <div class="col-xxl-3 col-md-6">
                            <div>
                                <label class="form-label">Visit Date</label>
                                <input type="date" class="form-control" name="date" required>
                            </div>
                        </div>            
                        <div class="col-xxl-3 col-md-6">
                            <div>
                                <label class="form-label">Customer Name</label>
                                <input type="text" class="form-control" name="customer_name" placeholder='Enter Customer Name' required>
                            </div>
                        </div>            
                        <div class="col-xxl-3 col-md-6">
                            <div>
                                <label class="form-label">Contact Number</label>
                                <input type="text" class="form-control" placeholder='Enter Contact Number' name="customer_contact" pattern="[6-9]{1}[0-9]{9}" title="Contact number should be 10 digits long and start with 6, 7, 8, or 9" required>
                            </div>
                        </div>            
                                                    
                    </div>

                    <div class="row gy-4">
                        <div class="col-xxl-3 col-md-6">
                            <div>
                                <label class="form-label">Remark</label>
                                <input type="text" class="form-control" name="remark" placeholder='Enter Remark' id='remark' required>
                                <div id="error-message" style="color: red; display: none;">Please enter at least 50 Characters.</div>

                            </div>
                        </div>    
                        <div class="col-xxl-3 col-md-6">
                            <div>
                                <label class="form-label">Location</label>
                                <input type="text" class="form-control" name="Visit_location" placeholder='Explame:-Kolar Road' required>
                            </div>
                        </div>    
                        <div class="col-xxl-3 col-md-6">
                            <div>
                                <label class="form-label">Upload Image</label>
                                <input type="file" class="form-control" name="image" pattern="imgae/*" required>
                            </div>
                        </div> 
                           
                    
                        <div class="col-xxl-3 col-md-6">
                            <div>
                                <label class="form-label">Location URL</label>
                                <input type="url" class="form-control" id="coordinates" pattern="https://.*" placeholder="https://map.com" required>
                            </div>
                        </div> 
                        
                    </div>
                    
                    <div class="row mt-2 gy-4" >
                        <div class="col-xxl-3 col-md-6">
                            <label class="form-label">Visit Type</label>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="visit_type" value='solo' id="soloVisit" checked>
                                <label class="form-check-label" for="soloVisit">Solo Visit</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="visit_type" value='team' id="teamVisit">
                                <label class="form-check-label" for="teamVisit">Team Visit</label>
                            </div>
                        </div>

                        <div id="dropdown-container" class="col-12" style="display:none;">

                            <div class='col-3'>
                                <label class="form-label">Co-Fellow</label>
                                <select class="form-select mb-3" name="co_name_0">
                                    <option value=''>Select Co-Fellow</option>
                                    {% for item in allmembers %}
                                        <option value="{{ item.member_name }}">{{ item.member_name }}</option>
                                    {% endfor %}
                                </select>
                                <a id="remove-button-0" class="btn btn-danger remove-button">x</a>
                            </div>
                        </div>   
                    </div>
                    <div class="row mb-3 mt-2">
                            <div class="col-xxl-3">
                                <a class='btn btn-primary' id="add-button">+</a>
                            </div>
                        </div>
                    <div class='row'>
                        <div class="d-flex justify-content-end">
                            <button class="btn btn-primary btn-border">Submit</button>                        
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>



<script>


document.addEventListener('DOMContentLoaded', function () {
    const teamVisitRadio = document.getElementById('teamVisit');
    const soloVisitRadio = document.getElementById('soloVisit');
    const dropdownContainer = document.getElementById('dropdown-container');
    const addButton = document.getElementById('add-button');

    // Function to toggle visibility of dropdowns based on radio selection
    function toggleDropdowns() {
        if (teamVisitRadio.checked) {
            dropdownContainer.style.display = 'block'; // Show dropdowns
        } else {
            dropdownContainer.style.display = 'none'; // Hide dropdowns
            // Reset dropdowns when hiding
            dropdownContainer.innerHTML = `
                    <div class='col-3'>
                        <label class="form-label">Co-Fellow</label>
                        <select class="form-select mb-3" name="co_name_0">
                            <option value=''>Select Co-Fellow</option>
                            {% for item in allmembers %}
                                <option value="{{ item.member_name }}">{{ item.member_name }}</option>
                            {% endfor %}
                        </select>
                        <a id="remove-button-0" class="btn btn-danger remove-button">x</a>
                    </div>
            `;
        }
    }

    // Initial toggle on page load
    toggleDropdowns();

    // Event listener for radio button change
    teamVisitRadio.addEventListener('change', toggleDropdowns);
    soloVisitRadio.addEventListener('change', toggleDropdowns);

    // Event listener for adding new dropdown
    addButton.addEventListener('click', function () {
        const dropdownCount = dropdownContainer.getElementsByTagName('select').length;

        const newCol = document.createElement('div');
        newCol.classList.add('col-xxl-3', 'col-md-6');

        newCol.innerHTML = `
            <label class="form-label">Co-Fellow ${dropdownCount + 1}</label>
            <select class="form-select mb-3" name="co_name_${dropdownCount + 1}">
                <option value=''>Select Co-Fellow</option>
                {% for item in allmembers %}
                    <option value="{{ item.member_name }}">{{ item.member_name }}</option>
                {% endfor %}
            </select>
            <button class="remove-button btn btn-danger">x</button>
        `;

        dropdownContainer.appendChild(newCol);

        // Add event listener for the remove button
        newCol.querySelector('.remove-button').addEventListener('click', function () {
            dropdownContainer.removeChild(newCol);
        });
    });
});





const remarkInput = document.getElementById('remark');
const errorMessage = document.getElementById('error-message');

remarkInput.addEventListener('input', function () {

    const charCount = remarkInput.value.length;

    if (charCount < 50) {
        errorMessage.style.display = 'block';
    } else {
        errorMessage.style.display = 'none';
    }
});



</script>




{% endblock %}
